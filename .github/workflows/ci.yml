name: CI
# CI uses synthetic data only. Tests that need private instrument data are marked #[ignore]
# (tests/real_data.rs) and run locally: see docs/testdata/README.md.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: No private instrument data in the repository
        shell: bash
        run: |
          if git ls-files | grep -Ei '(\.raw|\.wiff2?|\.mzml)$|^testData/|^test-data/'; then
            echo "instrument data is tracked by git"; exit 1
          fi
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  build-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Tests on synthetic data (ignored real-data tests are not run)
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets --no-fail-fast 2>&1 | tee test.log
      - name: Test results in the job summary
        if: always()
        shell: bash
        run: |
          echo "### Test results (${{ matrix.os }}, synthetic data only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^test result|Running|^test .* FAILED|panicked" test.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Known vulnerabilities in the dependencies
        run: |
          cargo install cargo-audit --locked
          cargo generate-lockfile
          cargo audit
