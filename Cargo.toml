[package]
name = "kvantx"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "KvantX - Scientific Quantification Engine: targeted LC-MS/MS quantification from Thermo RAW and mzML data"
repository = "https://github.com/markellerhorst/KvantX"
homepage = "https://github.com/markellerhorst/KvantX"
license = "MIT"
readme = "README.md"
build = "build.rs"
# ThermoRawFileParser, private test data and local data folders are never part of a package.
exclude = ["tools/", "testData/", "KvantX-default/", ".github/", "target/"]

[lib]
name = "kvantx"
path = "src/lib.rs"

[[bin]]
name = "kvantx"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.29"
rfd = "0.15"          # native file dialogs

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # embeds the .exe icon

[profile.release]
opt-level = 3
lto = true
